# Builds the game and publishes it to GitHub Pages on every push to main.
# Live URL: https://ljpublish.github.io/vcb/
#
# One-time repo setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# The Pages base path is passed on the command line (--base=/vcb/), so vite.config.ts and
# local `npm run dev` keep serving from "/". CI and play-tests live in a separate workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks, then bundles with every asset URL prefixed by /vcb/.
      - run: npm run build -- --base=/vcb/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
